services:
  db:
    image: postgres:16-alpine
    container_name: gestionrecursos-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestionrecursos}
      POSTGRES_USER: ${POSTGRES_USER:-gestion_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gestion_pass}
    ports:
      - "${POSTGRES_PORT:-5436}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: gestionrecursos-backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-gestion_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-gestion_pass}
      DB_DATABASE: ${POSTGRES_DB:-gestionrecursos}
    ports:
      - "${BACKEND_PORT:-4001}:4000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: gestionrecursos-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3001}:80"

  keycloak-db:
    image: postgres:16-alpine
    container_name: gestionrecursos-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_pass}
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.3
    container_name: gestionrecursos-keycloak
    restart: unless-stopped
    depends_on:
      - keycloak-db
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_pass}
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_pass}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    command: ["start-dev", "--import-realm"]
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import

volumes:
  postgres_data:
  keycloak_postgres_data:
